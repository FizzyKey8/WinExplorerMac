name: Build & Publish macOS Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-macos:
    name: Build WinExplorerMac.app & Create GitHub Release
    runs-on: macos-14
    steps:
      - name: Checkout repository (native git)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD

      - name: Sync Info.plist version from Git Tag
        run: |
          CLEAN_VER="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${CLEAN_VER}" Resources/Info.plist

      - name: Build & Package WinExplorerMac.app
        run: |
          chmod +x build_mac_app.sh
          ./build_mac_app.sh

      - name: Publish GitHub Release with DMG and ZIP (native gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              build/WinExplorerMac.dmg \
              build/WinExplorerMac-macOS.zip \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              build/WinExplorerMac.dmg \
              build/WinExplorerMac-macOS.zip \
              --title "WinExplorerMac ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
